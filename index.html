<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terminal to coach station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed splat canvas; a wayfinding-sign panel top-left, a playback bar along the bottom. */
:root {
  --ground: #121417;      /* charcoal behind the scene */
  --panel: #1d2126;
  --line: #353b43;
  --ink: #eef1f4;
  --muted: #9aa3ad;
  --sign: #ffcc00;        /* wayfinding yellow, same as the route line */
  --sign-ink: #15171a;
  --display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--display); overflow: hidden; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
#gl:active { cursor: grabbing; }

.panel {
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
  width: min(300px, calc(100vw - 32px));
  background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 6px;
  display: flex; flex-direction: column;
}
.sign { background: var(--sign); color: var(--sign-ink); padding: 9px 13px 8px; border-radius: 5px 5px 0 0; display: flex; align-items: baseline; gap: 9px; }
.sign h1 { margin: 0; font-size: 1.4rem; font-weight: 700; line-height: 1.05; letter-spacing: .01em; }
.sign .glyph { font-size: 1.25rem; font-weight: 700; }
.pbody { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 11px; }
.lede { margin: 0; color: var(--muted); font-size: .97rem; line-height: 1.35; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; margin: 0; }
.stats div { display: flex; flex-direction: column; min-width: 0; }
.stats dt { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stats dd { margin: 0; font-family: var(--mono); font-size: .92rem; font-variant-numeric: tabular-nums; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.toggles label { display: flex; align-items: center; gap: 6px; font-size: .98rem; cursor: pointer; }
.toggles input { accent-color: var(--sign); width: 16px; height: 16px; }
.progress { display: flex; flex-direction: column; gap: 5px; }
.progress .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; width: 0; background: var(--sign); transition: width .3s; }
.progress span { font-family: var(--mono); font-size: .78rem; color: var(--muted); }

.dock {
  position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 6px;
  padding: 9px 12px; display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap;
}
.btn { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 6px 11px;
  font: 600 1rem var(--display); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); min-width: 5.6em; }
.btn[aria-pressed="true"] { border-color: var(--sign); color: var(--sign); }
.btn:focus-visible, input:focus-visible, #gl:focus-visible { outline: 2px solid var(--sign); outline-offset: 2px; }
.clock { font-family: var(--mono); font-size: 1.1rem; color: var(--sign); font-variant-numeric: tabular-nums; min-width: 4.4ch; }
#time { flex: 1 1 200px; min-width: 0; accent-color: var(--sign); }
.mode { font-size: .95rem; color: var(--muted); min-width: 0; }
.help { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); max-width: 230px;
  background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: 6px;
  padding: 9px 12px; font-size: .92rem; color: var(--muted); line-height: 1.45; }
.help b { color: var(--ink); font-weight: 600; }
kbd { font-family: var(--mono); font-size: .78rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--ink); }
.error { position: fixed; inset: 0; display: grid; place-items: center; padding: 0 16px; text-align: center; font-size: 1.1rem; }
@media (max-width: 760px) {
  .help { display: none; }
  .lede, .stats { display: none; }
  .sign h1 { font-size: 1.15rem; }
}
</style>

<canvas id="gl" tabindex="0" aria-label="3D view of the airport walk. Drag to look around, use W A S D to move."></canvas>

<aside class="panel">
  <div class="sign"><span class="glyph" aria-hidden="true">✈</span></div>
  <div class="pbody">
    <dl class="stats">
      <div><dt>Splats loaded</dt><dd id="s-splats">0</dd></div>
      <div><dt>Route</dt><dd id="s-route">–</dd></div>
    </dl>
    <div class="progress" id="progress">
      <div class="bar"><i id="bar"></i></div>
      <span id="ptext">Loading scene…</span>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="showPath" checked> Route line</label>
      <label><input type="checkbox" id="xray" checked> Show through walls</label>
      <label><input type="checkbox" id="cut"> Cut away roof</label>
    </div>
  </div>
</aside>

<div class="help" id="help">
  <b>Look</b> drag<br>
  <b>Move</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows, scroll<br>
  <b>Up / down</b> <kbd>E</kbd> / <kbd>Q</kbd> &nbsp;<b>Faster</b> <kbd>Shift</kbd><br>
  <b>Touch</b> drag to look, pinch to move
</div>

<div class="dock">
  <button class="btn primary" id="play">▶ Replay</button>
  <span class="clock" id="clock">0:00</span>
  <input id="time" type="range" min="0" max="250" step="0.05" value="0" aria-label="Position along the walk">
  <button class="btn" id="speed" aria-label="Playback speed">1×</button>
  <button class="btn" id="follow">Back on route</button>
  <button class="btn" id="overview">Overview</button>
  <span class="mode" id="mode">On the route</span>
</div>

<script src="meta.js"></script>
<script>
(async function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const fail = msg => { const d = document.createElement("div"); d.className = "error"; d.textContent = msg; document.body.appendChild(d); };
  const canvas = $("gl");
  const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, depth: true, premultipliedAlpha: true, powerPreference: "high-performance" });
  if (!gl) { fail("This viewer needs WebGL 2, which this browser doesn't provide."); return; }
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

  // ---------- sorting / decoding worker ----------
  const workerSrc = `
  let meta, n = 0, loaded = 0, perRow = 0, texW = 0, pos, tex, texF;
  let pending = null, busy = false, depth, keys, idx, counts = new Uint32Array(65536);
  function bytesOf(d) {
    if (typeof d !== "string") return new Uint8Array(d);
    const s = atob(d), b = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }
  function decode(data, cnt) {
    const b = bytesOf(data);
    const p = new Uint16Array(b.buffer, b.byteOffset, cnt * 3);
    let o = cnt * 6;
    const sc = b.subarray(o, o + cnt * 3); o += cnt * 3;
    const qu = b.subarray(o, o + cnt * 4); o += cnt * 4;
    const co = b.subarray(o, o + cnt * 4); o += cnt * 4;
    const hb = b.subarray(o, o + cnt);
    const lo = meta.pos_min, hi = meta.pos_max;
    const k0 = (hi[0] - lo[0]) / 65535, k1 = (hi[1] - lo[1]) / 65535, k2 = (hi[2] - lo[2]) / 65535;
    const smin = meta.log_scale_min, sk = (meta.log_scale_max - smin) / 255;
    for (let k = 0; k < cnt; k++) {
      const i = loaded + k;
      const x = lo[0] + p[3 * k] * k0, y = lo[1] + p[3 * k + 1] * k1, z = lo[2] + p[3 * k + 2] * k2;
      pos[3 * i] = x; pos[3 * i + 1] = y; pos[3 * i + 2] = z;
      const sx = Math.exp(smin + sc[3 * k] * sk), sy = Math.exp(smin + sc[3 * k + 1] * sk), sz = Math.exp(smin + sc[3 * k + 2] * sk);
      let w = qu[4 * k] / 127.5 - 1, qx = qu[4 * k + 1] / 127.5 - 1, qy = qu[4 * k + 2] / 127.5 - 1, qz = qu[4 * k + 3] / 127.5 - 1;
      const qn = Math.hypot(w, qx, qy, qz) || 1; w /= qn; qx /= qn; qy /= qn; qz /= qn;
      const m00 = (1 - 2 * (qy * qy + qz * qz)) * sx, m01 = 2 * (qx * qy - w * qz) * sy, m02 = 2 * (qx * qz + w * qy) * sz;
      const m10 = 2 * (qx * qy + w * qz) * sx, m11 = (1 - 2 * (qx * qx + qz * qz)) * sy, m12 = 2 * (qy * qz - w * qx) * sz;
      const m20 = 2 * (qx * qz - w * qy) * sx, m21 = 2 * (qy * qz + w * qx) * sy, m22 = (1 - 2 * (qx * qx + qy * qy)) * sz;
      const row = (i / perRow) | 0, base = (row * texW + (i - row * perRow) * 3) * 4;
      texF[base] = x; texF[base + 1] = y; texF[base + 2] = z;
      tex[base + 3] = (co[4 * k] | (co[4 * k + 1] << 8) | (co[4 * k + 2] << 16) | (co[4 * k + 3] << 24)) >>> 0;
      texF[base + 4] = m00 * m00 + m01 * m01 + m02 * m02;
      texF[base + 5] = m00 * m10 + m01 * m11 + m02 * m12;
      texF[base + 6] = m00 * m20 + m01 * m21 + m02 * m22;
      texF[base + 7] = m10 * m10 + m11 * m11 + m12 * m12;
      texF[base + 8] = m10 * m20 + m11 * m21 + m12 * m22;
      texF[base + 9] = m20 * m20 + m21 * m21 + m22 * m22;
      texF[base + 10] = hb[k] === 255 ? 1e6 : hb[k] * 0.1 - 5;  // height above local floor
    }
    const r0 = (loaded / perRow) | 0;
    loaded += cnt;
    const r1 = Math.ceil(loaded / perRow);
    const rows = tex.slice(r0 * texW * 4, r1 * texW * 4);
    postMessage({ type: "rows", row: r0, rows: r1 - r0, data: rows, loaded }, [rows.buffer]);
  }
  function sort() {
    if (!pending || !loaded) { busy = false; return; }
    busy = true;
    const v = pending; pending = null;
    let m = 0, mn = Infinity, mx = -Infinity;
    for (let i = 0; i < loaded; i++) {   // only splats in front of the camera can be visible
      const d = v[2] * pos[3 * i] + v[6] * pos[3 * i + 1] + v[10] * pos[3 * i + 2] + v[14];
      if (d < 0.05) continue;
      idx[m] = i; depth[m] = d; m++;
      if (d < mn) mn = d; if (d > mx) mx = d;
    }
    const s = 65535 / Math.max(mx - mn, 1e-6);
    counts.fill(0);
    for (let j = 0; j < m; j++) { const k = ((mx - depth[j]) * s) | 0; keys[j] = k; counts[k]++; }
    for (let k = 1; k < 65536; k++) counts[k] += counts[k - 1];
    const order = new Uint32Array(m);
    for (let j = m - 1; j >= 0; j--) order[--counts[keys[j]]] = idx[j];
    postMessage({ type: "order", order, count: m }, [order.buffer]);
    setTimeout(sort, 0);
  }
  onmessage = e => {
    const m = e.data;
    if (m.type === "init") {
      meta = m.meta; n = meta.count; perRow = m.perRow; texW = perRow * 3;
      pos = new Float32Array(n * 3); depth = new Float32Array(n); keys = new Uint16Array(n); idx = new Uint32Array(n);
      tex = new Uint32Array(texW * Math.ceil(n / perRow) * 4); texF = new Float32Array(tex.buffer);
    } else if (m.type === "chunk") {
      decode(m.data, m.count);
      postMessage({ type: "decoded" });
      if (!busy) sort();
    } else if (m.type === "view") {
      pending = m.view;
      if (!busy) sort();
    }
  };`;
  const worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: "text/javascript" })));

  // ---------- GL helpers ----------
  function program(vs, fs) {
    const p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  const splatVS = `#version 300 es
  precision highp float; precision highp int;
  uniform highp usampler2D u_data;
  uniform mat4 u_view, u_proj;
  uniform vec2 u_focal, u_viewport;
  uniform int u_perRow;
  uniform float u_cut;
  in vec2 a_quad; in uint a_index;
  out vec4 v_color; out vec2 v_uv;
  void main() {
    int i = int(a_index);
    int row = i / u_perRow, col = (i - row * u_perRow) * 3;
    uvec4 t0 = texelFetch(u_data, ivec2(col, row), 0);
    vec4 cam = u_view * vec4(uintBitsToFloat(t0.xyz), 1.0);
    vec4 clip = u_proj * cam;
    float lim = 1.3 * clip.w;
    vec3 b = uintBitsToFloat(texelFetch(u_data, ivec2(col + 2, row), 0).xyz);
    if (cam.z < 0.05 || abs(clip.x) > lim || abs(clip.y) > lim || b.z > u_cut) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }
    vec4 a = uintBitsToFloat(texelFetch(u_data, ivec2(col + 1, row), 0));
    mat3 S = mat3(a.x, a.y, a.z, a.y, a.w, b.x, a.z, b.x, b.y);
    mat3 W = mat3(u_view);
    mat3 Sc = W * S * transpose(W);
    float iz = 1.0 / cam.z;
    vec3 J0 = vec3(u_focal.x * iz, 0.0, -u_focal.x * cam.x * iz * iz);
    vec3 J1 = vec3(0.0, -u_focal.y * iz, u_focal.y * cam.y * iz * iz);
    float c00 = dot(J0, Sc * J0) + 0.3, c01 = dot(J0, Sc * J1), c11 = dot(J1, Sc * J1) + 0.3;
    float mid = 0.5 * (c00 + c11), rad = length(vec2(0.5 * (c00 - c11), c01));
    float l1 = mid + rad, l2 = max(mid - rad, 0.1);
    vec2 e1 = abs(c01) > 1e-9 ? normalize(vec2(c01, l1 - c00)) : (c00 >= c11 ? vec2(1.0, 0.0) : vec2(0.0, 1.0));
    vec2 ax1 = min(sqrt(l1), 1024.0) * e1, ax2 = min(sqrt(l2), 1024.0) * vec2(-e1.y, e1.x);
    uint c = t0.w;
    v_color = vec4(float(c & 255u), float((c >> 8) & 255u), float((c >> 16) & 255u), float(c >> 24)) / 255.0;
    v_uv = a_quad;
    vec2 ndc = clip.xy / clip.w + (a_quad.x * ax1 + a_quad.y * ax2) * 2.0 / u_viewport;
    gl_Position = vec4(ndc, clip.z / clip.w, 1.0);
  }`;
  const splatFS = `#version 300 es
  precision highp float;
  in vec4 v_color; in vec2 v_uv; out vec4 o;
  void main() {
    float r2 = dot(v_uv, v_uv);
    if (r2 > 9.0) discard;
    float a = min(0.99, v_color.a * exp(-0.5 * r2));
    if (a < 0.004) discard;
    o = vec4(v_color.rgb * a, a);
  }`;
  const routeVS = `#version 300 es
  precision highp float;
  uniform mat4 u_view, u_proj;
  uniform vec3 u_campos;
  in vec3 a_center; in vec3 a_dir; in float a_along; in float a_side;
  out float v_along; out float v_side;
  void main() {
    float hw = max(0.15, 0.004 * distance(u_campos, a_center));  // stays visible from far away
    v_along = a_along; v_side = a_side;
    gl_Position = u_proj * u_view * vec4(a_center + a_side * hw * a_dir, 1.0);
  }`;
  const routeFS = `#version 300 es
  precision highp float;
  uniform float u_time, u_alpha, u_here;
  in float v_along; in float v_side; out vec4 o;
  void main() {
    float ph = fract((v_along - u_time * 1.4 + abs(v_side) * 0.32) / 1.3);
    float chev = smoothstep(0.0, 0.06, ph) * (1.0 - smoothstep(0.38, 0.44, ph));
    vec3 col = mix(vec3(1.0, 0.80, 0.0), vec3(1.0, 0.96, 0.62), 0.6 * chev);
    col *= 1.0 - 0.3 * smoothstep(0.7, 1.0, abs(v_side));
    if (u_here >= 0.0) {
      col = mix(col * 0.62, col, step(u_here, v_along));
      col = mix(col, vec3(1.0), exp(-pow((v_along - u_here) / 0.9, 2.0)));
    }
    o = vec4(col * u_alpha, u_alpha);
  }`;
  let splatProg, routeProg;
  try { splatProg = program(splatVS, splatFS); routeProg = program(routeVS, routeFS); }
  catch (e) { fail("The 3D view could not start on this device's graphics."); console.error(e); return; }
  const U = n => gl.getUniformLocation(splatProg, n), R = n => gl.getUniformLocation(routeProg, n);
  const su = { data: U("u_data"), view: U("u_view"), proj: U("u_proj"), focal: U("u_focal"), viewport: U("u_viewport"), perRow: U("u_perRow"), cut: U("u_cut") };
  const ru = { view: R("u_view"), proj: R("u_proj"), time: R("u_time"), alpha: R("u_alpha"), here: R("u_here"), campos: R("u_campos") };

  // ---------- data ----------
  // meta.js and splats_NN.js are plain scripts, so the page also works when opened from disk.
  const meta = window.SPLAT_META;
  if (!meta) { fail("The scene data (meta.js) was not found next to this page."); return; }
  const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  const perRow = Math.floor(Math.min(maxTex, 4095) / 3);
  // phones and low-memory devices get the most important splats only
  const light = matchMedia("(max-width: 760px)").matches || (navigator.deviceMemory || 8) <= 4;
  const capacity = Math.min(perRow * maxTex, light ? 2500000 : Infinity);
  const chunks = [];
  let total = 0;
  for (const c of meta.chunks) { if (total + c.count > capacity) break; chunks.push(c); total += c.count; }
  const fullCount = meta.count;
  meta.count = total;
  worker.postMessage({ type: "init", meta: { ...meta, path: null }, perRow });
  const texRows = Math.ceil(total / perRow);
  const dataTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, dataTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32UI, perRow * 3, texRows);

  const splatVAO = gl.createVertexArray();
  gl.bindVertexArray(splatVAO);
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-3, -3, 3, -3, -3, 3, 3, 3]), gl.STATIC_DRAW);
  const aQuad = gl.getAttribLocation(splatProg, "a_quad");
  gl.enableVertexAttribArray(aQuad); gl.vertexAttribPointer(aQuad, 2, gl.FLOAT, false, 0, 0);
  const orderBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, orderBuf);
  const aIndex = gl.getAttribLocation(splatProg, "a_index");
  gl.enableVertexAttribArray(aIndex); gl.vertexAttribIPointer(aIndex, 1, gl.UNSIGNED_INT, 0, 0); gl.vertexAttribDivisor(aIndex, 1);
  gl.bindVertexArray(null);
  let drawCount = 0, loadedSplats = 0;

  worker.onmessage = e => {
    const m = e.data;
    if (m.type === "rows") {
      gl.bindTexture(gl.TEXTURE_2D, dataTex);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, m.row, perRow * 3, m.rows, gl.RGBA_INTEGER, gl.UNSIGNED_INT, m.data);
      loadedSplats = m.loaded;
      $("s-splats").textContent = (loadedSplats / 1e6).toFixed(2) + " M";
      viewDirty = true;
    } else if (m.type === "order") {
      gl.bindBuffer(gl.ARRAY_BUFFER, orderBuf);
      gl.bufferData(gl.ARRAY_BUFFER, m.order, gl.DYNAMIC_DRAW);
      drawCount = m.count;
    } else if (m.type === "decoded") { decodedChunks++; updateProgress(); }
  };

  const totalBytes = chunks.reduce((s, c) => s + c.bytes, 0);
  let fetchedBytes = 0, decodedChunks = 0;
  function updateProgress() {
    const done = decodedChunks === chunks.length;
    $("bar").style.width = `${Math.round(100 * (fetchedBytes / totalBytes) * 0.5 + 50 * decodedChunks / chunks.length)}%`;
    $("ptext").textContent = done
      ? `${(total / 1e6).toFixed(1)} M splats loaded` + (total < fullCount ? ` (light mode, of ${(fullCount / 1e6).toFixed(1)} M)` : "")
      : `Loading scene ${(fetchedBytes / 1e6).toFixed(0)} / ${(totalBytes / 1e6).toFixed(0)} MB`;
    if (done) setTimeout(() => { $("progress").hidden = true; }, total < fullCount ? 8000 : 2500);
  }
  updateProgress();
  const arrived = {};
  window.SPLAT_CHUNK = (k, data) => { arrived[k] = data; };
  const loadScript = (src, k) => new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => { const d = arrived[k]; delete arrived[k]; s.remove(); d ? resolve(d) : reject(new Error(src)); };
    s.onerror = () => reject(new Error(src));
    document.head.appendChild(s);
  });
  (async () => {
    for (let k = 0; k < chunks.length; k++) {
      try {
        const data = await loadScript(chunks[k].file, k);
        fetchedBytes += chunks[k].bytes; updateProgress();
        worker.postMessage({ type: "chunk", data, count: chunks[k].count });
      } catch (e) { $("ptext").textContent = "Part of the scene did not load. Check that all splats_NN.js files are next to this page, then reload."; return; }
    }
  })();

  // ---------- route ribbon ----------
  const UP = [0, -1, 0];
  const P = meta.path, nP = P.t.length;
  const along = new Float32Array(nP);
  for (let i = 1; i < nP; i++) along[i] = along[i - 1] + Math.hypot(P.floor[i][0] - P.floor[i - 1][0], P.floor[i][1] - P.floor[i - 1][1], P.floor[i][2] - P.floor[i - 1][2]);
  $("s-route").textContent = `${Math.round(along[nP - 1])} m`;
  // per vertex: centre xyz, side direction xyz, distance along the route, side (-1 / +1)
  const ribbon = new Float32Array(nP * 2 * 8);
  let side = [1, 0, 0];
  for (let i = 0; i < nP; i++) {
    const a = P.floor[Math.max(0, i - 3)], b = P.floor[Math.min(nP - 1, i + 3)];
    const dx = b[0] - a[0], dz = b[2] - a[2], len = Math.hypot(dx, dz);
    if (len > 0.05) side = [dz / len, 0, -dx / len];   // horizontal perpendicular, cross(dir, up)
    for (let s = 0; s < 2; s++) {
      const o = (2 * i + s) * 8;
      ribbon.set(P.floor[i], o); ribbon.set(side, o + 3);
      ribbon[o + 6] = along[i]; ribbon[o + 7] = s ? 1 : -1;
    }
  }
  const routeVAO = gl.createVertexArray();
  gl.bindVertexArray(routeVAO);
  const rb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, rb); gl.bufferData(gl.ARRAY_BUFFER, ribbon, gl.STATIC_DRAW);
  const loc = n => gl.getAttribLocation(routeProg, n);
  [["a_center", 3, 0], ["a_dir", 3, 12], ["a_along", 1, 24], ["a_side", 1, 28]].forEach(([name, size, off]) => {
    gl.enableVertexAttribArray(loc(name)); gl.vertexAttribPointer(loc(name), size, gl.FLOAT, false, 32, off);
  });
  gl.bindVertexArray(null);

  // ---------- camera ----------
  const cam = { p: [0, 0, 0], yaw: 0, pitch: 0 };
  const look = { yaw: 0, pitch: 0 };
  let mode = "route", playing = false, speed = 1, t = meta.start_time || 0, viewDirty = true;
  const fovY = 62 * Math.PI / 180;
  const dirOf = (yaw, pitch) => [Math.cos(pitch) * Math.sin(yaw), -Math.sin(pitch), Math.cos(pitch) * Math.cos(yaw)];
  function sample(arr, tt) {
    let lo = 0, hi = nP - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (P.t[m] < tt) lo = m + 1; else hi = m; }
    const i1 = Math.max(1, lo), i0 = i1 - 1, span = P.t[i1] - P.t[i0];
    const k = span > 0 ? Math.min(1, Math.max(0, (tt - P.t[i0]) / span)) : 0;
    return [0, 1, 2].map(j => arr[i0][j] + (arr[i1][j] - arr[i0][j]) * k);
  }
  function alongAt(tt) {
    let lo = 0, hi = nP - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (P.t[m] < tt) lo = m + 1; else hi = m; }
    return along[lo];
  }
  function routePose() {
    const p = sample(P.pos, t), f = sample(P.fwd, t);
    const fl = Math.hypot(...f);
    const pitch = Math.asin(Math.max(-1, Math.min(1, -f[1] / fl)));
    const yaw = Math.atan2(f[0], f[2]);
    return { p, yaw: yaw + look.yaw, pitch: Math.max(-1.45, Math.min(1.45, pitch + look.pitch)) };
  }
  function setMode(m) {
    mode = m;
    $("mode").textContent = m === "route" ? "On the route" : "Free roam";
    $("follow").hidden = m === "route";
  }
  function toFree() {
    if (mode === "route") { const r = routePose(); cam.p = r.p; cam.yaw = r.yaw; cam.pitch = r.pitch; }
    setPlaying(false); setMode("free");
  }
  function setPlaying(on) {
    playing = on;
    $("play").textContent = on ? "❚❚ Pause" : "▶ Replay";
  }
  function viewMatrix(p, yaw, pitch) {
    const f = dirOf(yaw, pitch);
    let r = [f[1] * UP[2] - f[2] * UP[1], f[2] * UP[0] - f[0] * UP[2], f[0] * UP[1] - f[1] * UP[0]];
    const rl = Math.hypot(...r); r = r.map(x => x / rl);
    const d = [f[1] * r[2] - f[2] * r[1], f[2] * r[0] - f[0] * r[2], f[0] * r[1] - f[1] * r[0]];
    const tx = -(r[0] * p[0] + r[1] * p[1] + r[2] * p[2]), ty = -(d[0] * p[0] + d[1] * p[1] + d[2] * p[2]), tz = -(f[0] * p[0] + f[1] * p[1] + f[2] * p[2]);
    return new Float32Array([r[0], d[0], f[0], 0, r[1], d[1], f[1], 0, r[2], d[2], f[2], 0, tx, ty, tz, 1]);
  }

  // ---------- input ----------
  const keys = new Set();
  const MOVE_KEYS = ["w", "a", "s", "d", "q", "e", "arrowup", "arrowdown", "arrowleft", "arrowright", "shift"];
  addEventListener("keydown", e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key.toLowerCase(), tag = e.target.tagName;
    if (tag === "INPUT" && (k.startsWith("arrow") || k === " ")) return;  // let the slider / checkboxes use them
    if (k === " ") { if (tag !== "BUTTON") { e.preventDefault(); $("play").click(); } return; }
    if (MOVE_KEYS.includes(k)) { keys.add(k); if (k !== "shift") { toFree(); e.preventDefault(); } }
  });
  addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
  addEventListener("blur", () => keys.clear());
  const pointers = new Map();
  function rotate(dx, dy) {
    const k = fovY / canvas.clientHeight;
    if (mode === "route") { look.yaw -= dx * k; look.pitch = Math.max(-1.2, Math.min(1.2, look.pitch + dy * k)); }
    else { cam.yaw -= dx * k; cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + dy * k)); }
    viewDirty = true;
  }
  function moveBy(fwd, right, up) {
    const f = dirOf(cam.yaw, 0), r = [Math.cos(cam.yaw), 0, -Math.sin(cam.yaw)];
    for (let j = 0; j < 3; j++) cam.p[j] += f[j] * fwd + r[j] * right + UP[j] * up;
    viewDirty = true;
  }
  canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); canvas.focus({ preventScroll: true }); });
  canvas.addEventListener("pointermove", e => {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    const cur = [e.clientX, e.clientY];
    if (pointers.size === 1) rotate(cur[0] - prev[0], cur[1] - prev[1]);
    else if (pointers.size === 2) {
      const other = [...pointers.entries()].find(([id]) => id !== e.pointerId)[1];
      const d0 = Math.hypot(prev[0] - other[0], prev[1] - other[1]), d1 = Math.hypot(cur[0] - other[0], cur[1] - other[1]);
      toFree(); moveBy((d1 - d0) * 0.03, -(cur[0] - prev[0]) * 0.01, (cur[1] - prev[1]) * 0.01);
    }
    pointers.set(e.pointerId, cur);
  });
  const up = e => pointers.delete(e.pointerId);
  canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);
  canvas.addEventListener("wheel", e => { e.preventDefault(); toFree(); moveBy(-e.deltaY * 0.01, 0, 0); }, { passive: false });

  // ---------- controls ----------
  const slider = $("time");
  slider.max = meta.duration.toFixed(2);
  slider.value = t;
  const backToRoute = () => { setMode("route"); look.yaw = look.pitch = 0; $("cut").checked = false; viewDirty = true; };
  $("play").onclick = () => {
    if (mode !== "route") backToRoute();
    if (!playing && t >= meta.duration - 0.05) t = 0;
    setPlaying(!playing);
  };
  $("speed").onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; $("speed").textContent = speed + "×"; };
  $("follow").onclick = backToRoute;
  slider.oninput = () => { t = +slider.value; if (mode !== "route") backToRoute(); viewDirty = true; };
  $("overview").onclick = () => {
    let mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    for (const p of P.pos) for (let j = 0; j < 3; j++) { mn[j] = Math.min(mn[j], p[j]); mx[j] = Math.max(mx[j], p[j]); }
    const c = [(mn[0] + mx[0]) / 2, mn[1], (mn[2] + mx[2]) / 2];
    const ext = Math.max(mx[0] - mn[0], mx[2] - mn[2]);
    setPlaying(false); setMode("free"); $("cut").checked = true;
    cam.yaw = Math.atan2(c[0] - P.pos[0][0], c[2] - P.pos[0][2]);
    cam.pitch = -1.0;
    const f = dirOf(cam.yaw, cam.pitch), dist = ext * 0.7;
    cam.p = [c[0] - f[0] * dist, c[1] - f[1] * dist, c[2] - f[2] * dist];
    viewDirty = true;
  };
  $("showPath").onchange = $("xray").onchange = $("cut").onchange = () => { viewDirty = true; };
  setMode("route");

  // ---------- render loop ----------
  let last = performance.now(), lastView = null;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; viewDirty = true; }
  }
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    resize();
    if (playing) {
      t += dt * speed;
      if (t >= meta.duration) { t = meta.duration; setPlaying(false); }
      slider.value = t; viewDirty = true;
    }
    if (mode === "free") {
      const sp = (keys.has("shift") ? 9 : 3) * dt;
      const fw = (keys.has("w") || keys.has("arrowup") ? 1 : 0) - (keys.has("s") || keys.has("arrowdown") ? 1 : 0);
      const rt = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0);
      const vt = (keys.has("e") ? 1 : 0) - (keys.has("q") ? 1 : 0);
      if (fw || rt || vt) moveBy(fw * sp, rt * sp, vt * sp);
    }
    $("clock").textContent = fmt(t);
    const pose = mode === "route" ? routePose() : cam;
    const view = viewMatrix(pose.p, pose.yaw, pose.pitch);
    const W = canvas.width, H = canvas.height, aspect = W / H;
    const fy = 1 / Math.tan(fovY / 2), fx = fy / aspect, near = 0.05, far = 3000;
    const proj = new Float32Array([fx, 0, 0, 0, 0, -fy, 0, 0, 0, 0, (far + near) / (far - near), 1, 0, 0, -2 * far * near / (far - near), 0]);
    if (viewDirty || !lastView || view.some((x, i) => Math.abs(x - lastView[i]) > 1e-5)) {
      worker.postMessage({ type: "view", view });
      lastView = view; viewDirty = false;
    }
    gl.viewport(0, 0, W, H);
    gl.clearColor(0.071, 0.078, 0.09, 1); gl.clearDepth(1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const showPath = $("showPath").checked, here = alongAt(t);
    const time = reduceMotion ? 0 : now / 1000;
    function drawRoute(alpha) {
      gl.useProgram(routeProg);
      gl.uniformMatrix4fv(ru.view, false, view); gl.uniformMatrix4fv(ru.proj, false, proj);
      gl.uniform1f(ru.time, time); gl.uniform1f(ru.alpha, alpha); gl.uniform1f(ru.here, here);
      gl.uniform3fv(ru.campos, pose.p);
      gl.bindVertexArray(routeVAO); gl.drawArrays(gl.TRIANGLE_STRIP, 0, nP * 2);
    }
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
    if (showPath) { gl.disable(gl.BLEND); gl.depthMask(true); drawRoute(1); }
    if (drawCount) {
      gl.useProgram(splatProg);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, dataTex);
      gl.uniform1i(su.data, 0); gl.uniform1i(su.perRow, perRow);
      gl.uniform1f(su.cut, $("cut").checked ? 3.0 : 1e9);
      gl.uniformMatrix4fv(su.view, false, view); gl.uniformMatrix4fv(su.proj, false, proj);
      gl.uniform2f(su.focal, fx * W / 2, fy * H / 2); gl.uniform2f(su.viewport, W, H);
      gl.bindVertexArray(splatVAO);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, Math.min(drawCount, loadedSplats));
    }
    if (showPath && $("xray").checked) { gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); drawRoute(0.32); }
    gl.bindVertexArray(null);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
